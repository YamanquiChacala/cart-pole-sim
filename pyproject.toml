[project]
name = "cart-pole-sim"
version = "0.1.0"
description = "Cart with rigid pole pendulum simulator"
readme = "README.md"
requires-python = ">=3.15"
dependencies = ["matplotlib>=3.11.2"]

[project.scripts]
cart-pole-sim = "cart_pole_sim:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.17.6"]
